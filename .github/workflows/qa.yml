name: QA Automation

on:
  push:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3

      - name: Install Newman
        run: npm install -g newman

      - name: Run API Test + Generate Report
        run: |
          newman run api-testing/postman_collection.json \
          -r cli,html \
          --reporter-html-export newman-report.html

      - name: Debug (Check file)
        run: |
          echo "Checking files..."
          ls -la

      - name: Upload Report
        uses: actions/upload-artifact@v3
        with:
          name: newman-report
          path: newman-report.html
